[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alexdade31-evalplat_jd212"
version = "0.1.0"
description = "从样本里推断模型评测平台工程师·作业抢占与调度公平性应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "alexdade31" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://alexdade31.github.io"
Repository = "https://github.com/alexdade31/evalplat_jd212"
Issues = "https://github.com/alexdade31/evalplat_jd212/issues"

[project.scripts]
evalplat_jd212 = "evalplat_jd212:main"

[tool.setuptools]
py-modules = ["evalplat_jd212"]
